name: sanrio_characters_app
description: A Flutter application for Sanrio characters.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.0.0

  # 🔥 FIREBASE DEPENDENCIES
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_database: ^11.0.0
  firebase_analytics: ^11.0.0

  # 🤖 ML & IMAGE DEPENDENCIES
  tflite_flutter: ^0.12.0
  image_picker: ^1.0.0
  image: ^4.1.0

  # 💾 LOCAL STORAGE
  shared_preferences: ^2.2.2

  # 📊 CHARTING
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/character_gallery/
    - assets/labels.txt
    - assets/model_unquant.tflite
